global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'loki'
    static_configs:
      - targets: ['192.168.101.67:3100']
  - job_name: 'server'
    static_configs:
      - targets:
          - 192.168.101.67:9100
  - job_name: docker
      # metrics_path defaults to '/metrics'
      # scheme defaults to 'http'.
    static_configs:
      - targets: ["host.docker.internal:9323"]
  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
    - targets:
      - cadvisor:8080